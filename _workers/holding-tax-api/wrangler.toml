name = "holding-tax-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
VWORLD_DOMAIN = "ella1-crypto.github.io"
ALLOWED_ORIGINS = "https://ella1-crypto.github.io,http://localhost:5178"

# 비밀값(저장소에 넣지 않음): npx wrangler secret put VWORLD_KEY
# 상태(2026-10-15): VWorld가 Cloudflare 서버 IP의 접속을 막아(520/502) 현재 계산기에서 사용하지 않는다.
# 같은 코드를 AWS Lambda 서울(lambda.mjs, RELAY-AWS.md)에서 돌려 국내 IP로 VWorld를 부른다.

[placement]
region = "aws:ap-northeast-2"
