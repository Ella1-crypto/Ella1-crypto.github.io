# heeya 자동 연재 빈자리 검사: PC 예약 작업(재테크 11:09·AI 10:51·무료강의 10:25)이 안 돌아 큐가 비면
# @Threads_heeyadailyfit_bot 으로 알린다. 큐는 읽기만 하고 바꾸지 않는다. (2026-11-03)
# Secrets: HEEYA_TELEGRAM_TOKEN, HEEYA_TELEGRAM_CHAT_ID
name: series-check

on:
  schedule:
    - cron: "40 3 * * *"   # 매일 12:40 KST (GitHub cron은 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check series queue
        env:
          HEEYA_TELEGRAM_TOKEN: ${{ secrets.HEEYA_TELEGRAM_TOKEN }}
          HEEYA_TELEGRAM_CHAT_ID: ${{ secrets.HEEYA_TELEGRAM_CHAT_ID }}
        run: python _automation/jaetech_series_check.py
