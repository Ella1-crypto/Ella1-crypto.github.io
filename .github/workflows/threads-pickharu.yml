# pick.haru 쇼핑 글 자동 게시: _automation/pickharu-queue.json 에서 시각이 된 글을 올리고 링크는 첫 댓글로 단다.
# 필요한 Secrets: PICKHARU_THREADS_ACCESS_TOKEN (threads-oauth로 저장), GH_SECRETS_PAT (토큰 자동 갱신)
# 주 경로: 큐 파일이 push되면 바로 실행 → 320분 안의 예약 글을 시각마다 기다렸다가 하나씩 올린다.
# 보조 경로: 30분마다 cron(밀리거나 건너뛸 수 있음). 봇 커밋은 워크플로를 다시 깨우지 않는다.
# 토큰 점검·갱신은 큐를 건드리지 않으므로 별도 job·별도 concurrency로 돌린다(긴 게시 실행 뒤에서 취소되지 않게).
name: threads-pickharu

on:
  push:
    branches: [main]
    paths: ["_automation/pickharu-queue.json"]
  schedule:
    - cron: "17,47 * * * *"   # 30분마다 (보조, 올릴 글이 없으면 바로 끝남)
    - cron: "10 0 * * 1"      # 매주 월요일 09:10 KST, 토큰 점검 + 자동 갱신
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 토큰만 점검, refresh = 토큰 점검 후 갱신, publish = 예약 글 올리기"
        default: check
        type: choice
        options: [check, refresh, publish]

permissions:
  contents: write

jobs:
  token:
    if: github.event.schedule == '10 0 * * 1' || inputs.mode == 'check' || inputs.mode == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: threads-pickharu-token
      cancel-in-progress: false
    env:
      PICKHARU_THREADS_ACCESS_TOKEN: ${{ secrets.PICKHARU_THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check token
        run: python _automation/pickharu_publish.py --check
      - name: Refresh token
        if: github.event.schedule == '10 0 * * 1' || inputs.mode == 'refresh'
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          pip install --quiet pynacl==1.5.0
          python _automation/pickharu_publish.py --refresh

  publish:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]')
      || github.event.schedule == '17,47 * * * *' || inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 350   # push 실행은 최대 320분 동안 예약 글을 기다린다
    concurrency:
      group: threads-pickharu
      cancel-in-progress: false
    env:
      PICKHARU_THREADS_ACCESS_TOKEN: ${{ secrets.PICKHARU_THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 앞 실행을 기다리는 사이 바뀐 큐를 받도록 push 시점 커밋 대신 최신 main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "threads-pickharu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Wait for scheduled times and publish
        if: github.event_name == 'push'
        run: python _automation/pickharu_publish.py --wait
      - name: Publish due post
        if: github.event_name != 'push'
        run: python _automation/pickharu_publish.py
